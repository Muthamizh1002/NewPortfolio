<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070814" />
    </linearGradient>
    <linearGradient id="mGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="8" />

  <!-- Subtle Accent Light Ray -->
  <circle cx="256" cy="256" r="180" fill="rgba(59, 130, 246, 0.12)" filter="url(#glow)" />

  <!-- Styled 'M' Monogram -->
  <path d="M 136 384 V 138 H 188 L 256 280 L 324 138 H 376 V 384 H 324 V 222 L 268 334 H 244 L 188 222 V 384 Z" 
        fill="url(#mGradient)" 
        filter="url(#glow)" />

  <!-- Accent Tech Dots -->
  <circle cx="136" cy="138" r="10" fill="#60a5fa" />
  <circle cx="376" cy="138" r="10" fill="#60a5fa" />
</svg>
